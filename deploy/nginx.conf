# nginx.conf - serve o site de estudo em concursos.casa:8099
#
# O container responde DIRETAMENTE no domínio concursos.casa, porta 8099.
# Por isso o site é servido na RAIZ (/), sem subpath.
# (O caminho antigo /concursos continua respondendo, redirecionando para a raiz,
#  para não quebrar links já salvos.)
#
# Site 100% estático: o nginx só entrega arquivos via sendfile, sem CPU relevante.
# Deliberadamente simples — menos diretivas, menos chance de quebrar.

worker_processes 1;                 # 3 usuários simultâneos não exigem mais

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # o mime.types padrão já cobre m4a/mp4/png; só o markdown falta
    types {
        text/markdown  md;
    }

    sendfile      on;               # entrega direta do arquivo (kernel), sem cópia
    tcp_nopush    on;
    keepalive_timeout 30;

    # logs enxutos: evita encher o disco de um servidor doméstico
    access_log off;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json text/markdown;
    gzip_min_length 1024;
    # mídia (m4a/mp4/png) já é comprimida — não entra no gzip

    server {
        listen 80;                  # porta interna do container (mapeada p/ 8099 no host)
        server_name concursos.casa _;

        root /srv/site;
        index index.html;

        # O container escuta na 80 mas é publicado na 8099: sem isso o nginx
        # monta o Location dos redirects com a porta INTERNA (…localhost/ em vez
        # de …concursos.casa:8099/). Redirect relativo evita o problema de vez.
        absolute_redirect off;
        port_in_redirect  off;

        # healthcheck do container
        location = /healthz {
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # O site é local, mas embute mídia e roda `site.js`; estes três headers
        # custam nada e fecham o básico.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;

        # compatibilidade: o endereço antigo /concursos/<algo> leva ao mesmo
        # <algo> na raiz — preserva deep link já salvo/compartilhado
        location = /concursos { return 301 /; }
        location ^~ /concursos/ {
            rewrite ^/concursos/(.*)$ /$1 permanent;
        }

        # HTML nunca é cacheado.
        #
        # O `expires 1h` do `location /` alcançava TODO o site, HTML incluído — e o
        # `?v=<hash>` que o gerador põe no CSS/JS só cura metade do problema: ele
        # garante que a página nova puxe o asset novo, mas se a própria PÁGINA vier
        # de cache, o deploy simplesmente não aparece por até uma hora. O sintoma é
        # o mesmo que motivou o versionamento de asset — a página renderiza, só
        # renderiza o conteúdo de antes.
        #
        # É barato: o HTML deste site é pequeno, e o que pesa (mídia) continua com
        # cache longo, casado com o nome de arquivo, que é único por aprofundamento.
        location ~* \.html$ {
            # `expires -1` já emite `Expires` no passado E `Cache-Control: no-cache`
            # — não acrescente um `add_header Cache-Control` junto, sai duplicado.
            expires -1;
            # Os três de segurança REPETIDOS aqui de propósito: `add_header` numa
            # `location` SUBSTITUI o conjunto herdado do `server` em vez de somar a
            # ele. Sem esta repetição, justamente as páginas HTML — as únicas que o
            # navegador interpreta — sairiam sem eles. Verificado com o container de
            # pé, que é a única forma de ver isto.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        # o site vive na raiz
        # (o nginx já envia Accept-Ranges: bytes em estáticos, então o seek
        #  de áudio/vídeo funciona sem configuração adicional)
        location / {
            try_files $uri $uri/ $uri/index.html =404;
            expires 1h;             # assets versionados e mídia: cache curto basta
        }
    }
}
