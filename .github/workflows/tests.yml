name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do sistema
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Instalar dependências Python (opcionais)
        run: pip install reportlab pyyaml   # pyyaml: usado no step que valida o docker-compose

      - name: Rodar smoke tests de todas as skills
        run: bash scripts/test-all.sh

      - name: Validar sintaxe dos scripts shell
        run: |
          # inclui scripts/tests/*.sh: as suítes de shell ficaram de fora quando
          # existia só a do install, e uma suíte que não compila passaria batido
          for f in scripts/*.sh scripts/tests/*.sh; do bash -n "$f"; done

      - name: Higiene do pacote (sem caches nem nomes estranhos)
        run: |
          ! find skills -name "__pycache__" | grep . || (echo "cache commitado" && exit 1)
          ! find . -name '*{*' -o -name '*}*' | grep . || (echo "nome invalido" && exit 1)

      - name: Validar docker-compose e shell do deploy
        run: |
          python -c "import yaml; yaml.safe_load(open('deploy/docker-compose.yml'))"
          bash -n deploy/deploy.sh

      - name: Consistência de versões (SKILL.md / README / CHANGELOG)
        run: |
          erro=0
          for d in skills/*/; do
            n=$(basename "$d")
            v=$(grep -m1 '^version:' "$d/SKILL.md" | sed 's/version: *//')
            rv=$(grep -o 'Versão atual: \*\*[0-9.]*' "$d/README.md" | grep -o '[0-9.]*$')
            # ancorado em '^## [': o grep solto pegava o PRIMEIRO colchete numérico
            # do arquivo, que hoje é o título da versão mas seria uma citação no meio
            # de um texto introdutório — e aí a comparação rodaria contra lixo
            ch=$(grep -m1 -oE '^## \[[0-9.]+\]' "$d/CHANGELOG.md" | grep -o '[0-9.]*')
            # `v` vazio não é erro por si: o pipeline devolve o status do sed
            if [ -z "$v" ]; then
              echo "::error::$n sem 'version:' no SKILL.md"; erro=1; continue
            fi
            if [ "$v" != "$rv" ] || [ "$v" != "$ch" ]; then
              echo "::error::$n versões divergentes: SKILL=$v README=$rv CHANGELOG=$ch"
              erro=1
            fi
          done
          exit $erro

      - name: Toda skill citada na documentação principal
        run: |
          erro=0
          for d in skills/*/; do
            n=$(basename "$d")
            for f in README.md CLAUDE.md docs/ARQUITETURA.md; do
              grep -q "$n" "$f" || { echo "::error::$n ausente em $f"; erro=1; }
            done
          done
          exit $erro

      # As convenções de uma skill saíram do CLAUDE.md da raiz para o
      # CONVENCOES.md dela — carregado junto com a skill em vez de em todo turno.
      # A troca só é segura com um guarda: sem ele, regra nova nasceria num arquivo
      # que ninguém abre, e o índice da raiz — que é como se descobre que ela existe
      # — envelheceria calado. Foi assim que o `.claude/CLAUDE.md` perdeu as cinco
      # convenções inteiras da concurso-afere.
      - name: Índice de convenções cobre todas as regras por skill
        run: |
          python - <<'PY'
          import pathlib, re, sys
          raiz = pathlib.Path("CLAUDE.md").read_text(encoding="utf-8")
          problemas = []
          for conv in sorted(pathlib.Path("skills").glob("*/CONVENCOES.md")):
              if str(conv) not in raiz:
                  problemas.append(f"{conv} não está linkado no CLAUDE.md da raiz")
                  continue
              for m in re.finditer(r"^- \*\*(.+?)\*\*", conv.read_text(encoding="utf-8"),
                                   re.M | re.S):
                  titulo = re.sub(r"\s+", " ", m.group(1)).rstrip(" .:—-")
                  if titulo not in raiz:
                      problemas.append(f"{conv}: regra fora do índice — {titulo!r}")
          for x in problemas:
              print(f"::error::{x}")
          sys.exit(1 if problemas else 0)
          PY

      # `05-HISTORICO` é a forma CURTA e não existe no vault: o nome real é
      # `05-HISTORICO-CONCURSO`, e o diagrama do README é a primeira coisa que se vê.
      - name: Nome de pasta do vault na forma real
        run: |
          ! grep -rn '05-HISTORICO\b' --include='*.md' --include='*.mmd' . \
            | grep -v '05-HISTORICO-CONCURSO' | grep . \
            || (echo "::error::use 05-HISTORICO-CONCURSO, que é o nome real" && exit 1)

      # A linha `Versão atual:` é metadado que o CI lê — não é changelog. Ela já
      # chegou a 4.631 chars num README de 6.552: 70% do arquivo era um segundo
      # changelog, pior que o primeiro, com parênteses desbalanceados.
      - name: "Versão atual e uma linha de metadado, nao um changelog"
        run: |
          erro=0
          for d in skills/*/; do
            n=$(basename "$d")
            linha=$(grep -m1 'Versão atual:' "$d/README.md" || true)
            if [ "${#linha}" -gt 400 ]; then
              echo "::error::$n: linha 'Versão atual' com ${#linha} chars (máx 400) — o histórico vai no CHANGELOG.md"
              erro=1
            fi
          done
          exit $erro

      # O README é o índice navegável da documentação: link apontando para arquivo
      # que não existe (ou que foi movido) transforma o índice em armadilha.
      - name: Links relativos da documentação resolvem
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, sys

          def ancora_github(titulo):
              """Minúsculas, sem pontuação, espaço->hífen. ACENTO FICA — o GitHub o
              preserva, e removê-lo faz `#documentação` virar falso positivo."""
              t = re.sub(r"[^\w\s-]", "", titulo.strip().lower(), flags=re.UNICODE)
              return re.sub(r"\s+", "-", t)

          docs = [l for l in subprocess.run(["git", "ls-files"], capture_output=True,
                                            text=True).stdout.split("\n") if l.endswith(".md")]
          quebrados = []
          for d in docs:
              p = pathlib.Path(d)
              for rot, alvo in re.findall(r"\[([^\]]+)\]\(([^)]+)\)",
                                          p.read_text(encoding="utf-8")):
                  if alvo.startswith(("http", "mailto:", "<", "{")):
                      continue
                  cam, _, frag = alvo.partition("#")
                  cam = cam.strip()
                  # `[alt](src)` aparece em CHANGELOG como sintaxe citada, não link
                  if cam == "src":
                      continue
                  destino = p if not cam else (p.parent / cam)
                  if cam and not destino.exists():
                      quebrados.append(f"{d}: [{rot}]({alvo}) — arquivo inexistente")
                      continue
                  if frag and destino.suffix == ".md":
                      titulos = re.finditer(r"^#+\s+(.+)$",
                                            destino.read_text(encoding="utf-8"), re.M)
                      if frag not in {ancora_github(m.group(1)) for m in titulos}:
                          quebrados.append(f"{d}: [{rot}]({alvo}) — âncora inexistente")
          for q in quebrados:
              print(f"::error::link quebrado — {q}")
          sys.exit(1 if quebrados else 0)
          PY

      # O diagrama vive em dois lugares: o .mmd é a fonte (e carrega os comentários
      # %% com as pegadinhas de layout) e o bloco ```mermaid do README é o que o
      # GitHub renderiza. Duas cópias da mesma informação divergem sem um guarda.
      - name: Diagrama do fluxo sincronizado entre .mmd e README
        run: |
          python - <<'PY'
          import pathlib, re, sys
          mmd = pathlib.Path("docs/fluxo-concurso.mmd").read_text(encoding="utf-8")
          sem_comentario = "\n".join(l for l in mmd.split("\n")
                                     if not l.strip().startswith("%%")).strip()
          arq = pathlib.Path("README.md").read_text(encoding="utf-8")
          m = re.search(r"```mermaid\n(.*?)\n```", arq, re.S)
          if not m:
              print("::error::bloco ```mermaid ausente em README.md")
              sys.exit(1)
          if m.group(1).strip() != sem_comentario:
              print("::error::README.md divergiu de docs/fluxo-concurso.mmd "
                    "— edite o .mmd e cole o bloco (sem as linhas %%)")
              sys.exit(1)
          PY
